  # ---------------------------------------------------- community feeds
  # Aggregate sources. Community feeds catch deals that no single vendor page
  # will advertise, and they are the discovery layer for vendors we cannot poll
  # directly. These are the highest-value sources in the whole watchlist.
  - slug: hacker-news
    name: Hacker News
    category: hosting
    tier: 1
    service_line: discovery
    sources:
      - url: https://hn.algolia.com/api/v1/search_by_date?query=black%20friday&tags=story&hitsPerPage=50
        kind: api
        adapter: hackernews
        cadence_minutes: 30
      - url: https://hn.algolia.com/api/v1/search_by_date?query=deal&tags=story&hitsPerPage=50
        kind: api
        adapter: hackernews
        cadence_minutes: 60

