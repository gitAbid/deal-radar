# Deal Radar — watchlist
#
# Single source of truth for what is watched. Seeded into the `vendor` and
# `source` tables by `pnpm seed` (collector/seed.ts). Upserts by vendor slug and
# by (vendor, url), so editing this file and re-running seed is safe.
#
# tier 1 = polled every `cadence_minutes` (default 15)
# tier 2 = polled every 6 hours
#
# NOTE ON VENDOR-PAGE SOURCES
# Vendor deal/pricing URLs marked `note: unverified` have not been checked
# against the live site. The /sources page in the dashboard is the verification
# mechanism: anything returning non-200 or extracting nothing shows as
# degraded/failing there. Fix the URL, or set `enabled: false` to silence it.
#
# NOTE ON TERMS OF SERVICE
# Some vendors forbid automated collection. Those vendors are listed with no
# sources at all — they are watched via community feeds instead. Do not add a
# source for a vendor you have not cleared.

