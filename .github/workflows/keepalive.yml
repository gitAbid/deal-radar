name: keepalive

# Spec §10: GitHub silently disables a scheduled workflow after 60 days with no
# repository activity. For a system whose entire job is to notice things, being
# disabled without a notification is the worst possible failure. This makes a
# trivial commit every week so the collect schedule stays armed.
#
# [skip ci] in the commit message stops ci.yml from running on it.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write timestamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt

      - name: Commit if changed
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "No change; nothing to commit."
          else
            git commit -m "chore: keepalive [skip ci]"
            git push
          fi
